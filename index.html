<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Platform Digital Bandung</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="login-header">
            <h2>Masuk ke Platform</h2>
        </header>

        <!-- Satu-satunya form login platform (pdb/README.md bagian Frontend).
             QR (desktop) atau tombol magic link (HP) dirender auth.js crootjs ke #whatsauthqr. -->
        <main class="login-main">
            <p class="lead-text">Scan QR di bawah dengan kamera WhatsApp, atau tap tombolnya kalau membuka halaman ini dari HP. Nomor WhatsApp kamu yang menjadi identitas masuk.</p>
            <div class="qr-wrapper" id="whatsauthqr"></div>
            <p class="status-text">QR berganti otomatis. Hitung mundur:</p>
            <p class="status-text" id="whatsauthcounter"></p>
        </main>
    </div>

    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
